[package]
name = "dmcp"
version = "0.1.0"
edition = "2021"
description = "MCP Manager - discover, manage, and invoke MCP servers"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
sha2 = "0.10"
shellexpand = "3"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "0.16", features = ["server", "client", "transport-io", "transport-child-process", "macros", "schemars", "transport-streamable-http-client-reqwest", "auth"] }
schemars = "1"
# Signed-in accounts live in the OS keyring (#229); one store crate per OS.
keyring-core = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["user"] }

# async-io, not tokio: the store is called from blocking threads, and a tokio
# runtime inside it would have to be entered first. crypto-rust keeps the
# static musl release free of OpenSSL.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
# test-util: paused-clock tests of the bounded relay drain, without real waits
tokio = { version = "1", features = ["full", "test-util"] }
