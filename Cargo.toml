[package]
name = "dmcp"
version = "0.1.0"
edition = "2021"
description = "MCP Manager - discover, manage, and invoke MCP servers"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
shellexpand = "3"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "0.16", features = ["server", "client", "transport-io", "transport-child-process", "macros", "schemars", "transport-streamable-http-client-reqwest"] }
schemars = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["user"] }

[dev-dependencies]
# test-util: paused-clock tests of the bounded relay drain, without real waits
tokio = { version = "1", features = ["full", "test-util"] }
